<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rainbow Orbit</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <game-hud id="hud"></game-hud>
        <game-overlay id="overlay"></game-overlay>
        <canvas id="gameCanvas"></canvas>
    </div>
    
    <!-- Noise texture overlay -->
    <div class="noise"></div>

    <script src="main.js" type="module"></script>

    <!-- GameDistribution SDK -->
    <script type="text/javascript">
        window["GD_OPTIONS"] = {
            "gameId": "b2a0dfd7914b40d99441eb8d12fbf2f4",
            "onEvent": function(event) {
                switch (event.name) {
                    case "SDK_GAME_START":
                        console.log("GD SDK: SDK_GAME_START");
                        if (window.game && typeof window.game.resume === 'function') {
                            window.game.resume();
                        }
                        break;
                    case "SDK_GAME_PAUSE":
                        console.log("GD SDK: SDK_GAME_PAUSE");
                        if (window.game && typeof window.game.pause === 'function') {
                            window.game.pause();
                        }
                        break;
                    case "SDK_READY":
                        console.log("GD SDK: SDK_READY");
                        break;
                    case "SDK_ERROR":
                        console.warn("GD SDK: SDK_ERROR", event);
                        break;
                }
            },
        };
        (function(d, s, id) {
            var js, fjs = d.getElementsByTagName(s)[0];
            if (d.getElementById(id)) return;
            js = d.createElement(s); js.id = id;
            js.src = 'https://html5.api.gamedistribution.com/main.min.js';
            fjs.parentNode.insertBefore(js, fjs);
        }(document, 'script', 'gamedistribution-jssdk'));
    </script>
</body>
</html>
